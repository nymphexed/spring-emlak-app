<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Profil</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div th:replace="~{navbar :: body}"></div>

    <div class="container mt-5">
      <div th:if="${successMessage}" class="alert alert-success mt-3">
        <span th:text="${successMessage}"></span>
      </div>
      <div th:if="${!kullanici.isSeller}">
        <form action="/profil/satici-ol" method="post">
          <input
            type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}"
          />
          <button class="btn btn-warning mt-2">
            Satıcı Ol – İlan Ver, Kazan
          </button>
        </form>
      </div>
      <a th:href="@{/favori/liste}" class="btn btn-outline-primary mt-2"
        >Favorilerim</a
      >
      <div sec:authorize="hasRole('SATICI')">
        <a th:href="@{/satici/ilanlarim}" class="btn btn-outline-primary mt-2">
          İlanlarıma git
        </a>
      </div>
      <div style="margin-top: 20px">
        <h2>Profil Bilgileri</h2>

        <ul class="list-group mb-4">
          <li class="list-group-item">
            <strong>Rol:</strong>
            <span
              th:text="${kullanici.isSeller ? 'Satıcı' : 'Kullanıcı'}"
            ></span>
          </li>
          <li class="list-group-item">
            <strong>Ad:</strong> <span th:text="${kullanici.ad}"></span>
          </li>
          <li class="list-group-item">
            <strong>Soyad:</strong> <span th:text="${kullanici.soyad}"></span>
          </li>
          <li class="list-group-item">
            <strong>Email:</strong> <span th:text="${kullanici.email}"></span>
          </li>
        </ul>
      </div>
      <div th:if="${kullanici.isSeller}">
        <form action="/profil/satici-kaldir" method="post">
          <input
            type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}"
          />
          <button class="btn btn-danger">Satıcı Profilini Kaldır</button>
        </form>
      </div>

      <hr />

      <div class="d-flex flex-column gap-2">
        <!-- Eğer işletme varsa göster -->
        <div th:if="${kullanici.isSeller and kullanici.isletme != null}">
          <h3>Emlak İşletmesi</h3>

          <ul class="list-group mb-3">
            <li class="list-group-item">
              <strong>İşletme Adı:</strong>
              <span th:text="${kullanici. isletme.isletmeAdi}"></span>
            </li>
            <li class="list-group-item">
              <strong>Yetkili:</strong>
              <span th:text="${kullanici.isletme.yetkili}"></span>
            </li>
            <li class="list-group-item">
              <strong>Adres:</strong>
              <span th:text="${kullanici.isletme.adres}"></span>
            </li>
            <li class="list-group-item">
              <strong>Telefon:</strong>
              <span th:text="${kullanici.isletme.telefon}"></span>
            </li>
            <li class="list-group-item">
              <strong>Fax:</strong>
              <span th:text="${kullanici.isletme.fax}"></span>
            </li>
          </ul>

          <form action="/profil/isletme-sil" method="post">
            <input
              type="hidden"
              th:name="${_csrf.parameterName}"
              th:value="${_csrf.token}"
            />
            <button class="btn btn-danger">İşletmeyi Sil</button>
          </form>
        </div>

        <!-- Eğer işletme yoksa ekleme butonu -->
        <div th:if="${kullanici.isSeller and kullanici.isletme == null}">
          <button id="isletmeEkleBtn" class="btn btn-success">
            Emlak İşletmesi Ekle
          </button>

          <!-- İşletme ekleme formu (başta gizli) -->
          <form
            id="isletmeForm"
            action="/profil/isletme-ekle"
            method="post"
            style="display: none"
          >
            <input
              type="hidden"
              th:name="${_csrf.parameterName}"
              th:value="${_csrf.token}"
            />
            <div class="mb-3">
              <label>İşletme Adı</label>
              <input
                type="text"
                name="isletmeAdi"
                class="form-control"
                required
              />
            </div>

            <div class="mb-3">
              <label>Yetkili</label>
              <input type="text" name="yetkili" class="form-control" required />
            </div>

            <div class="mb-3">
              <label>Adres</label>
              <input type="text" name="adres" class="form-control" required />
            </div>

            <div class="mb-3">
              <label>Telefon</label>
              <input type="text" name="telefon" class="form-control" required />
            </div>

            <div class="mb-3">
              <label>Fax</label>
              <input type="text" name="fax" class="form-control" />
            </div>

            <button type="submit" class="btn btn-success">Kaydet</button>
          </form>
        </div>
      </div>
    </div>
    <script>
      const isletmeBtn = document.getElementById("isletmeEkleBtn");
      if (isletmeBtn) {
        isletmeBtn.addEventListener("click", function () {
          document.getElementById("isletmeForm").style.display = "block";
        });
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script th:if="${confetti}">
      confetti({
        particleCount: 200,
        spread: 80,
        origin: { y: 0.6 },
      });
    </script>
    <style>
      .d-flex.flex-column.gap-2 button,
      .d-flex.flex-column.gap-2 a {
        min-width: 100px;
        width: 15%;
      }
      .btn.btn-outline-primary {
        padding: 5px 10px;
        min-width: 100px;
        width: 15%;
      }
    </style>
  </body>
</html>
