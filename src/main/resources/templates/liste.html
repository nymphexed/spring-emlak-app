<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Emlak Listesi</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body class="bg-light">
    <div th:replace="navbar :: body"></div>
    <div class="container mt-5">
      <h1 class="mb-4">Emlak Listesi</h1>

      <a href="/emlak/yeni" class="btn btn-primary mb-3">Yeni Emlak Ekle</a>

      <table class="table table-bordered table-striped table-hover">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Başlık</th>
            <th>Fiyat</th>
            <th>Adres</th>
            <th>Oda</th>
            <th>m²</th>
            <th>İl</th>
            <th>İlçe</th>
            <th>Bina Yaşı</th>
            <th>Kat</th>
            <th>Eşyalı</th>
            <th>Isıtma</th>
            <th>Açıklama</th>
            <th>İşlem</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="e : ${liste}">
            <td th:text="${e.id}"></td>
            <td th:text="${e.baslik}"></td>
            <td th:text="${e.fiyat}"></td>
            <td th:text="${e.adres}"></td>
            <td th:text="${e.odaSayisi}"></td>
            <td th:text="${e.metrekare}"></td>
            <td th:text="${e.il}"></td>
            <td th:text="${e.ilce}"></td>
            <td th:text="${e.binaYasi}"></td>
            <td th:text="${e.kat}"></td>
            <td th:text="${e.esyali}"></td>
            <td th:text="${e.isitmaTipi}"></td>
            <td th:text="${e.aciklama}"></td>

            <td>
              <a
                th:href="@{'/emlak/sil/' + ${e.id}}"
                class="btn btn-danger btn-sm"
                >Sil</a
              >
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
