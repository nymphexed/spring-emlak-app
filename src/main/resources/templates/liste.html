<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Emlak Listesi</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
      .popup-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1050;
        overflow-y: scroll;
      }

      .popup-content {
        background: white;
        padding: 20px;
        border-radius: 8px;
        width: 400px;
        max-width: 90%;
        margin: 20px auto auto auto;
      }

      .popup-close {
        width: 100%;
        text-align: right;
        margin: 10px 10px auto 20px;
        background: transparent;
        border: none;
        font-size: 20px;
      }

      .popup-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }
      .popup-header h3 {
        margin: 10px auto auto 10px;
      }
    </style>
  </head>

  <body class="bg-light">
    <div th:replace="~{navbar :: body}"></div>

    <div class="container mt-5">
      <h1 class="mb-4">Emlak Listesi</h1>
      <div class="d-flex justify-content-end mb-3">
        <a
          id="yazdirBtn"
          style="display: none"
          th:href="@{/emlak/yazdir(
        ilId=${ilId},
        ilceId=${ilceId},
        kategoriId=${kategoriId},
        odaSayisi=${odaSayisi},
        minMetrekare=${minMetrekare},
        maxMetrekare=${maxMetrekare},
        minFiyat=${minFiyat},
        maxFiyat=${maxFiyat},
        binaYasi=${binaYasi},
        kat=${kat},
        esyali=${esyali},
        isitmaTipi=${isitmaTipi}
   )}"
          class="btn btn-outline-dark"
        >
          Yazıcı Çıktısı Al &#128438;
        </a>
      </div>
      <!-- Arama Kutusu -->
      <div class="d-flex justify-content-between align-items-center">
        <form class="input-group mb-4" method="get" th:action="@{/emlak}">
          <input
            type="text"
            name="q"
            class="form-control"
            placeholder="İlan ara..."
            th:value="${param.q}"
          />
          <button class="btn btn-primary">Ara</button>
          <button id="filtreleBtn" class="btn btn-outline-dark" type="button">
            Filtrele
          </button>
        </form>
      </div>
      <table
        id="ilanTablosu"
        class="table table-bordered table-striped table-hover"
      >
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Başlık</th>
            <th>Fotoğraflar</th>
            <th>Fiyat</th>
            <th>Adres</th>
            <th>Oda</th>
            <th>m²</th>
            <th>İl</th>
            <th>İlçe</th>
            <th>Bina Yaşı</th>
            <th>Kat</th>
            <th>Eşyalı</th>
            <th>Isıtma</th>
            <th>Kullanıcı</th>
            <th>Açıklama</th>
            <th>İşlem</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="e : ${liste}">
            <td th:text="${e.id}"></td>
            <td th:text="${e.baslik}"></td>
            <td style="width: 180px">
              <div th:if="${#lists.size(e.fotolar) > 0}">
                <div
                  id="carousel-[[${e.id}]]"
                  class="carousel slide"
                  data-bs-ride="carousel"
                  data-bs-interval="2500"
                >
                  <div class="carousel-inner">
                    <div
                      th:each="f, iter : ${e.fotolar}"
                      th:classappend="${iter.index == 0} ? ' active' : ''"
                      class="carousel-item"
                    >
                      <img
                        th:src="${f}"
                        class="d-block w-100"
                        style="
                          height: 120px;
                          object-fit: cover;
                          border-radius: 4px;
                        "
                      />
                    </div>
                  </div>

                  <!-- Önceki -->
                </div>
              </div>

              <div th:if="${#lists.size(e.fotolar) == 0}">
                <span class="text-muted">Fotoğraf yok</span>
              </div>
            </td>

            <td th:text="${e.fiyat} + ' ₺'"></td>
            <td th:text="${e.adres}"></td>
            <td th:text="${e.odaSayisi}"></td>
            <td th:text="${e.metrekare}"></td>

            <!-- İl ve İlçe doğru gösterim -->
            <td th:text="${e.il} ?: '-'"></td>
            <td th:text="${e.ilce} ?: '-'"></td>

            <td th:text="${e.binaYasi}"></td>
            <td th:text="${e.kat}"></td>

            <!-- Eşyalı -->
            <td th:text="${e.esyali == 1 ? 'Evet' : 'Hayır'}"></td>

            <td th:text="${e.isitmaTipi}"></td>
            <td th:text="${e.kullaniciBilgisi}"></td>
            <td th:text="${e.aciklama}"></td>

            <td>
              <a
                th:href="@{'/emlak/detay/' + ${e.id}}"
                class="btn btn-info btn-sm"
              >
                Detay
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div id="filtrePopup" class="popup-overlay">
      <div class="popup-content">
        <div class="popup-header">
          <h3>Filtrele</h3>
          <button class="popup-close" onclick="kapatPopup()">✕</button>
        </div>

        <form id="filtreForm" method="get">
          <label>İl</label>
          <select id="ilSelect" name="ilId" class="form-control">
            <option value="">Seçiniz</option>
            <option
              th:each="il : ${iller}"
              th:value="${il.id}"
              th:text="${il.ad}"
            ></option>
          </select>

          <label>İlçe</label>
          <select id="ilceSelect" name="ilceId" class="form-control">
            <option value="">Seçiniz</option>
            <option
              th:each="ilce : ${ilceler}"
              th:value="${ilce.id}"
              th:text="${ilce.ad}"
            ></option>
          </select>

          <label>Kategori</label>
          <select name="kategoriId" class="form-control">
            <option value="">Seçiniz</option>
            <option
              th:each="kat : ${kategoriler}"
              th:value="${kat.id}"
              th:text="${kat.ad}"
            ></option>
          </select>

          <label>Oda Sayısı</label>
          <input type="number" name="odaSayisi" class="form-control" />

          <label>Min m²</label>
          <input type="number" name="minMetrekare" class="form-control" />

          <label>Max m²</label>
          <input type="number" name="maxMetrekare" class="form-control" />

          <label>Min Fiyat</label>
          <input type="number" name="minFiyat" class="form-control" />

          <label>Max Fiyat</label>
          <input type="number" name="maxFiyat" class="form-control" />

          <label>Bina Yaşı</label>
          <input type="number" name="binaYasi" class="form-control" />

          <label>Kat</label>
          <input type="number" name="kat" class="form-control" />

          <label>Eşyalı</label>
          <select name="esyali" class="form-control">
            <option value="">Farketmez</option>
            <option value="1">Eşyalı</option>
            <option value="0">Eşyasız</option>
          </select>

          <label>Isıtma Tipi</label>
          <input type="text" name="isitmaTipi" class="form-control" />

          <button
            type="submit"
            id="filtreUygulaBtn"
            class="btn btn-primary mt-3"
          >
            Filtreyi Uygula
          </button>
        </form>
      </div>
    </div>

    <script>
      const popup = document.getElementById("filtrePopup");
      const btn = document.getElementById("filtreleBtn");

      btn.onclick = () => (popup.style.display = "flex");
      function kapatPopup() {
        popup.style.display = "none";
      }
    </script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("filtreForm");
        const popup = document.getElementById("filtrePopup");
        const btn = document.getElementById("filtreleBtn");

        // Popup aç/kapa
        btn.onclick = () => (popup.style.display = "flex");
        window.kapatPopup = () => (popup.style.display = "none");

        // Form submit yakalama
        form.addEventListener("submit", function (e) {
          e.preventDefault(); // Sayfa yenilenmesin

          const params = new URLSearchParams(new FormData(form)).toString();

          fetch("/emlak/arama-sonuc-json?" + params)
            .then((res) => res.json())
            .then((data) => {
              tabloyuGuncelle(data);
              popup.style.display = "none"; // İstersen kapat
            })
            .catch((err) => console.error("Hata:", err));
        });
      });
    </script>
    <script>
      function tabloyuGuncelle(liste) {
        const tbody = document.querySelector("#ilanTablosu tbody");
        tbody.innerHTML = "";

        liste.forEach((e) => {
          let fotoHtml = "";

          if (e.fotolar && e.fotolar.length > 0) {
            let items = "";
            e.fotolar.forEach((f, i) => {
              items += `
                    <div class="carousel-item ${i === 0 ? "active" : ""}">
                        <img src="${f}" class="d-block w-100"
                             style="height:120px; object-fit:cover; border-radius:4px;">
                    </div>
                `;
            });

            fotoHtml = `
                <div id="carousel-${e.id}" class="carousel slide" data-bs-ride="carousel" >
                    <div class="carousel-inner">
                        ${items}
                    </div>
                </div>
            `;
          } else {
            fotoHtml = `<span class="text-muted">Fotoğraf yok</span>`;
          }

          tbody.innerHTML += `
            <tr>
                <td>${e.id}</td>
                <td>${e.baslik}</td>
                <td style="width:180px">${fotoHtml}</td>
                <td>${e.fiyat} ₺</td>
                <td>${e.adres}</td>
                <td>${e.odaSayisi}</td>
                <td>${e.metrekare}</td>
                <td>${e.il ?? "-"}</td>
                <td>${e.ilce ?? "-"}</td>
                <td>${e.binaYasi}</td>
                <td>${e.kat}</td>
                <td>${e.esyali == 1 ? "Evet" : "Hayır"}</td>
                <td>${e.isitmaTipi}</td>
                <td>${e.aciklama}</td>
                <td>
                    <a href="/emlak/detay/${e.id}" class="btn btn-info btn-sm">Detay</a>
                </td>
            </tr>
        `;
        });
      }
    </script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const ilSelect = document.getElementById("ilSelect");
        const ilceSelect = document.getElementById("ilceSelect");

        ilSelect.addEventListener("change", function () {
          const ilId = ilSelect.value;

          // İl seçilmediyse ilçeleri temizle
          if (!ilId) {
            ilceSelect.innerHTML = '<option value="">Seçiniz</option>';
            return;
          }

          fetch(`/emlak/ilceler?ilId=${ilId}`)
            .then((res) => res.json())
            .then((ilceler) => {
              ilceSelect.innerHTML = '<option value="">Seçiniz</option>';

              ilceler.forEach((ilce) => {
                ilceSelect.innerHTML += `
                        <option value="${ilce.id}">${ilce.ad}</option>
                    `;
              });
            })
            .catch((err) => console.error("İlçe yükleme hatası:", err));
        });
      });
    </script>
    <script th:inline="javascript">
      document.addEventListener("DOMContentLoaded", function () {
        const popup = document.getElementById("filtrePopup");

        const filtreAc = /*[[${filtreAc}]]*/ false;

        if (filtreAc) {
          popup.style.display = "flex";
        }
      });
    </script>
    <script>
      document
        .getElementById("filtreUygulaBtn")
        .addEventListener("click", function () {
          document.getElementById("yazdirBtn").style.display = "inline-block";
          console.log("Filtre popup açıldı");
        });
    </script>
  </body>
</html>
