<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Emlak Listesi</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </head>

  <body class="bg-light">
    <div th:replace="~{navbar :: body}"></div>

    <div class="container mt-5">
      <h1 class="mb-4">Emlak Listesi</h1>

      <!-- Arama Kutusu -->
      <form class="input-group mb-4" method="get" th:action="@{/emlak}">
        <input
          type="text"
          name="q"
          class="form-control"
          placeholder="İlan ara..."
          th:value="${param.q}"
        />
        <button class="btn btn-primary">Ara</button>
      </form>

      <table class="table table-bordered table-striped table-hover">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Başlık</th>
            <th>Fiyat</th>
            <th>Adres</th>
            <th>Oda</th>
            <th>m²</th>
            <th>İl</th>
            <th>İlçe</th>
            <th>Bina Yaşı</th>
            <th>Kat</th>
            <th>Eşyalı</th>
            <th>Isıtma</th>
            <th>Açıklama</th>
            <th>İşlem</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="e : ${liste}">
            <td th:text="${e.id}"></td>
            <td th:text="${e.baslik}"></td>
            <td th:text="${e.fiyat} + ' ₺'"></td>
            <td th:text="${e.adres}"></td>
            <td th:text="${e.odaSayisi}"></td>
            <td th:text="${e.metrekare}"></td>

            <!-- İl ve İlçe doğru gösterim -->
            <td th:text="${e.il.ad}"></td>
            <td th:text="${e.ilce.ad}"></td>

            <td th:text="${e.binaYasi}"></td>
            <td th:text="${e.kat}"></td>

            <!-- Eşyalı -->
            <td th:text="${e.esyali == 1 ? 'Evet' : 'Hayır'}"></td>

            <td th:text="${e.isitmaTipi}"></td>
            <td th:text="${e.aciklama}"></td>

            <td>
              <a
                th:href="@{'/emlak/detay/' + ${e.id}}"
                class="btn btn-info btn-sm"
              >
                Detay
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
