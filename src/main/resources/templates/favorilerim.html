<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Favorilerim</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div th:replace="~{navbar :: body}"></div>

    <div class="container mt-5">
      <h2 class="mb-4">Favorilerim</h2>

      <!-- Favori yoksa -->
      <div th:if="${#lists.isEmpty(liste)}" class="alert alert-info">
        Henüz favori ilanınız yok.
      </div>

      <!-- Favoriler varsa -->
      <div class="row" th:if="${!#lists.isEmpty(liste)}">
        <div class="col-md-4 mb-4" th:each="e : ${liste}">
          <div class="card shadow-sm h-100">
            <img
              th:src="${e.fotolar != null and !e.fotolar.isEmpty() 
                ? e.fotolar.get(0) 
                : '/img/no-image.png'}"
              class="card-img-top"
              style="height: 220px; object-fit: cover"
            />

            <div class="card-body">
              <h5 class="card-title" th:text="${e.baslik}"></h5>

              <p class="text-muted" th:text="${e.il} + ' • ' + ${e.ilce}"></p>

              <p
                class="fw-bold text-primary fs-5"
                th:text="${e.fiyat} + ' ₺'"
              ></p>

              <a
                th:href="@{'/emlak/detay/' + ${e.id}}"
                class="btn btn-outline-primary w-100"
              >
                Detaya Git
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
