<nav
  class="navbar navbar-expand-lg navbar-bg"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
  th:fragment="body"
>
  <div
    class="container-fluid d-flex justify-content-between align-items-center"
  >
    <!-- SOL: Logo -->
    <a class="navbar-brand" href="/">
      <img src="/img/logo.png" class="logo" alt="Logo" />
    </a>

    <!-- ORTA: Menü -->
    <div class="d-flex align-items-center gap-3">
      <a href="/emlak" class="btn btn-sm btn-outline-dark fs-5">
        Tüm İlanlar
      </a>

      <div sec:authorize="hasRole('SATICI')">
        <a href="/satici/ilanlarim" class="btn btn-sm btn-outline-dark fs-5">
          İlanlarım
        </a>
      </div>
    </div>

    <!-- SAĞ: Login / Logout -->
    <div class="d-flex align-items-end gap-2">
      <div
        sec:authorize="isAuthenticated()"
        class="d-flex align-items-center gap-2"
      >
        Hoşgeldin,
        <span th:text="${adSoyad}"></span>
        <form th:action="@{/logout}" method="post">
          <input
            type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}"
          />
          <button type="submit" class="btn btn-sm btn-danger">Çıkış Yap</button>
        </form>
      </div>

      <div sec:authorize="isAnonymous()">
        <a href="/login" class="btn btn-sm btn-primary">Giriş Yap</a>
      </div>
    </div>
  </div>

  <style>
    .logo {
      max-height: 60px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }
  </style>
</nav>
