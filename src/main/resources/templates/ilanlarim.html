<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>İlanlarım</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
  </head>

  <body class="bg-light">
    <div th:replace="~{navbar :: body}"></div>

    <div class="container mt-4">
      <h2 class="mb-4">İlanlarım</h2>

      <!-- Yeni ilan ekleme butonu -->
      <div class="mb-3">
        <a href="/satici/yeni" class="btn btn-success">Yeni İlan Ekle</a>
      </div>

      <!-- İlan tablosu -->
      <table class="table table-striped table-bordered shadow-sm">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Başlık</th>
            <th>Fiyat</th>
            <th>İl</th>
            <th>İşlemler</th>
          </tr>
        </thead>

        <tbody>
          <!-- BOŞ LİSTE MESAJI BURADA OLMALI -->
          <tr th:if="${ilanlar == null or #lists.isEmpty(ilanlar)}">
            <td colspan="5" class="text-center text-muted fs-5">
              Henüz bir ilan eklemediniz.
            </td>
          </tr>

          <!-- İLANLAR -->
          <tr th:each="e : ${ilanlar}">
            <td th:text="${e.id}"></td>
            <td th:text="${e.baslik}"></td>
            <td th:text="${e.fiyat} + ' ₺'"></td>
            <td th:text="${e.il.ad}"></td>

            <td>
              <a
                th:href="@{'/satici/duzenle/' + ${e.id}}"
                class="btn btn-primary btn-sm"
                >Düzenle</a
              >

              <a
                th:href="@{'/satici/sil/' + ${e.id}}"
                class="btn btn-danger btn-sm"
                onclick="
                  return confirm('Bu ilanı silmek istediğine emin misin?');
                "
              >
                Sil
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
