<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Emlak Detayı</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css"
      rel="stylesheet"
    />
    <style>
      .modal-backdrop.show {
        opacity: 0.1 !important; /* %20 karartma — istersen 0.1 yaparız */
      }
    </style>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
  </head>
  <body class="bg-light">
    <div th:replace="~{navbar :: body}"></div>
    <div class="container mt-5">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 th:text="${emlak.baslik}">Emlak Başlığı</h1>
        <div sec:authorize="isAuthenticated()">
          <button
            id="favoriBtn"
            class="btn"
            th:classappend="${favorideMi} ? 'btn-danger' : 'btn-outline-danger'"
            th:data-id="${emlak.id}"
            onclick="favoriDegistir(this)"
            th:text="${favorideMi} ? 'Favorilerden Çıkar 💔' : 'Favorilere Ekle ❤️'"
          ></button>
        </div>
      </div>
      <div th:if="${#lists.size(emlak.fotolar) > 0}">
        <div id="detayCarousel" class="carousel slide">
          <!-- Indicators -->
          <div class="carousel-indicators">
            <button
              th:each="f, iter : ${emlak.fotolar}"
              type="button"
              th:attr="data-bs-target='#detayCarousel', data-bs-slide-to=${iter.index}"
              th:classappend="${iter.index == 0} ? 'active' : ''"
            ></button>
          </div>

          <!-- Fotoğraflar -->
          <div class="carousel-inner">
            <div
              th:each="f, iter : ${emlak.fotolar}"
              class="carousel-item"
              th:classappend="${iter.index == 0} ? ' active' : ''"
            >
              <div
                style="
                  width: 100%;
                  height: 500px;
                  background: #000;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                "
              >
                <!-- FOTOĞRAFA TIKLAYINCA POP-UP AÇILIR -->
                <a
                  href="#"
                  data-bs-toggle="modal"
                  data-bs-target="#fotoModal"
                  th:attr="data-img=${f.url}"
                >
                  <img
                    th:src="${f.url}"
                    style="
                      max-height: 100%;
                      max-width: 100%;
                      object-fit: contain;
                      cursor: zoom-in;
                    "
                  />
                </a>
              </div>
            </div>
          </div>

          <!-- Sol ok -->
          <button
            class="carousel-control-prev"
            type="button"
            data-bs-target="#detayCarousel"
            data-bs-slide="prev"
          >
            <span class="carousel-control-prev-icon"></span>
          </button>

          <!-- Sağ ok -->
          <button
            class="carousel-control-next"
            type="button"
            data-bs-target="#detayCarousel"
            data-bs-slide="next"
          >
            <span class="carousel-control-next-icon"></span>
          </button>
        </div>
      </div>

      <div th:if="${#lists.size(emlak.fotolar) == 0}">
        <p class="text-muted">Bu ilana ait fotoğraf bulunmamaktadır.</p>
      </div>
      <ul class="list-group mb-3">
        <li class="list-group-item">
          <strong>Adres:</strong> <span th:text="${emlak.adres}"></span>
        </li>
        <li class="list-group-item">
          <strong>Fiyat:</strong> <span th:text="${emlak.fiyat}"></span> TL
        </li>
        <li class="list-group-item">
          <strong>Metrekare:</strong> <span th:text="${emlak.metrekare}"></span>
        </li>
        <li class="list-group-item">
          <strong>Oda Sayısı:</strong>
          <span th:text="${emlak.odaSayisi}"></span>
        </li>
        <li class="list-group-item">
          <strong>Bina Yaşı:</strong> <span th:text="${emlak.binaYasi}"></span>
        </li>
        <li class="list-group-item">
          <strong>Kat:</strong> <span th:text="${emlak.kat}"></span>
        </li>
        <li class="list-group-item">
          <strong>Eşyalı mı?:</strong>
          <span th:text="${emlak.esyali == 1 ? 'Evet' : 'Hayır'}"></span>
        </li>
        <li class="list-group-item">
          <strong>Isıtma Tipi:</strong>
          <span th:text="${emlak.isitmaTipi}"></span>
        </li>
        <li class="list-group-item">
          <strong>Açıklama:</strong> <span th:text="${emlak.aciklama}"></span>
        </li>
      </ul>

      <a href="/emlak" class="btn btn-secondary">Listeye Dön</a>
      <div class="modal fade" id="fotoModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered" style="max-width: 70%">
          <div
            class="modal-content"
            style="background: transparent; border: none; box-shadow: none"
          >
            <div class="modal-body">
              <div id="modalCarousel" class="carousel slide">
                <div class="carousel-inner">
                  <div
                    th:each="f, iter : ${emlak.fotolar}"
                    class="carousel-item"
                    th:classappend="${iter.index == 0} ? ' active' : ''"
                  >
                    <div
                      style="
                        width: 100%;
                        height: 70vh;
                        background: #00000044;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                      "
                    >
                      <img
                        th:src="${f.url}"
                        style="
                          max-height: 100%;
                          max-width: 100%;
                          object-fit: contain;
                        "
                      />
                    </div>
                  </div>
                </div>

                <!-- Sol ok -->
                <button
                  class="carousel-control-prev"
                  type="button"
                  data-bs-target="#modalCarousel"
                  data-bs-slide="prev"
                >
                  <span class="carousel-control-prev-icon"></span>
                </button>

                <!-- Sağ ok -->
                <button
                  class="carousel-control-next"
                  type="button"
                  data-bs-target="#modalCarousel"
                  data-bs-slide="next"
                >
                  <span class="carousel-control-next-icon"></span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/js/lightbox.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.addEventListener("click", function (e) {
        if (e.target.closest("[data-bs-target='#fotoModal']")) {
          const imgUrl = e.target.closest("a").getAttribute("data-img");
          document.getElementById("modalImage").src = imgUrl;
        }
      });
    </script>
    <script>
      function favoriDegistir(btn) {
        const ilanId = btn.getAttribute("data-id");

        const token = document.querySelector('meta[name="_csrf"]').content;
        const header = document.querySelector(
          'meta[name="_csrf_header"]',
        ).content;
        // Backend'e favori ekleme isteği gönder
        fetch(
          `/favori/toggle/${ilanId}`,

          {
            method: "POST",
            headers: {
              [header]: token,
              "X-Requested-With": "XMLHttpRequest",
            },
          },
        ).then((res) => {
          if (res.ok) {
            // UI güncelle
            if (btn.classList.contains("btn-outline-danger")) {
              btn.classList.remove("btn-outline-danger");
              btn.classList.add("btn-danger");
              btn.innerHTML = "Favorilerden Çıkar 💔";
            } else {
              btn.classList.remove("btn-danger");
              btn.classList.add("btn-outline-danger");
              btn.innerHTML = "Favorilere Ekle ❤️";
            }
          }
        });
      }
    </script>
  </body>
</html>
