<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Üye Ol</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f5f7fa;
        font-family: Arial, sans-serif;
      }

      .register-card {
        max-width: 450px;
        margin: 60px auto;
        padding: 35px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      }
    </style>
  </head>

  <body>
    <div class="register-card">
      <h2 class="text-center mb-4">Üye Ol</h2>

      <form th:action="@{/register}" method="post">
        <!-- 1) Satıcı olmak istiyorum -->
        <div class="form-check mb-3">
          <input
            class="form-check-input"
            type="checkbox"
            id="saticiCheck"
            name="seller"
          />
          <label class="form-check-label" for="saticiCheck">
            Satıcı olmak istiyorum
          </label>
        </div>

        <!-- 2) İşletme eklemek istiyorum (sadece satıcı seçilirse görünür) -->
        <div id="isletmeEkleContainer" style="display: none">
          <div class="form-check mb-3">
            <input
              class="form-check-input"
              type="checkbox"
              id="isletmeCheck"
              name="isletmeEkle"
            />
            <label class="form-check-label" for="isletmeCheck">
              Emlak işletmesi eklemek istiyorum
            </label>
          </div>
        </div>

        <!-- 3) İşletme bilgileri (sadece işletme ekle seçilirse görünür) -->
        <div id="isletmeForm" style="display: none">
          <div class="mb-3">
            <label class="form-label">İşletme Adı</label>
            <input type="text" name="isletmeAdi" class="form-control" />
          </div>

          <div class="mb-3">
            <label class="form-label">Yetkili</label>
            <input type="text" name="yetkili" class="form-control" />
          </div>

          <div class="mb-3">
            <label class="form-label">Adres</label>
            <input type="text" name="adres" class="form-control" />
          </div>

          <div class="mb-3">
            <label class="form-label">Telefon</label>
            <input type="text" name="telefon" class="form-control" />
          </div>

          <div class="mb-3">
            <label class="form-label">Fax</label>
            <input type="text" name="fax" class="form-control" />
          </div>
        </div>

        <hr />

        <!-- Kullanıcı Bilgileri -->
        <div class="mb-3">
          <label class="form-label">Ad</label>
          <input type="text" name="ad" class="form-control" required />
        </div>

        <div class="mb-3">
          <label class="form-label">Soyad</label>
          <input type="text" name="soyad" class="form-control" required />
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required />
        </div>

        <div class="mb-3">
          <label class="form-label">Şifre</label>
          <input type="password" name="sifre" class="form-control" required />
        </div>

        <button type="submit" class="btn btn-primary w-100">Üye Ol</button>
      </form>

      <div class="text-center mt-3">
        <span>Zaten hesabın var mı?</span>
        <a href="/login">Giriş Yap</a>
      </div>
    </div>

    <script>
      const saticiCheck = document.getElementById("saticiCheck");
      const isletmeEkleContainer = document.getElementById(
        "isletmeEkleContainer",
      );
      const isletmeCheck = document.getElementById("isletmeCheck");
      const isletmeForm = document.getElementById("isletmeForm");

      // Satıcı seçilirse işletme ekleme seçeneği görünür
      saticiCheck.addEventListener("change", function () {
        isletmeEkleContainer.style.display = this.checked ? "block" : "none";

        if (!this.checked) {
          isletmeCheck.checked = false;
          isletmeForm.style.display = "none";
        }
      });

      // İşletme eklemek istiyorum seçilirse işletme formu görünür
      isletmeCheck.addEventListener("change", function () {
        isletmeForm.style.display = this.checked ? "block" : "none";
      });
    </script>
  </body>
</html>
