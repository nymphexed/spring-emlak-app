<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title
      th:text="${emlak.id == null} ? 'Yeni Emlak Ekle' : 'İlanı Düzenle'"
    ></title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
      .foto-kutu {
        width: 100%;
        height: 150px;
        border-radius: 6px;
        overflow: hidden;
        position: relative;
        background: #f5f5f5;
      }

      .foto-kutu img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .foto-sil-btn {
        position: absolute;
        top: 5px;
        right: 5px;
      }
    </style>
  </head>

  <body class="bg-light">
    <div th:replace="~{navbar :: body}"></div>

    <div class="container mt-5">
      <h1
        class="mb-4"
        th:text="${emlak.id == null} ? 'Yeni Emlak Ekle' : 'İlanı Düzenle'"
      ></h1>

      <!-- TEK FORM -->
      <form
        th:action="@{/satici/kaydet}"
        th:object="${emlak}"
        method="post"
        enctype="multipart/form-data"
        class="row g-3"
      >
        <input type="hidden" th:field="*{id}" />
        <input
          type="hidden"
          th:name="${_csrf.parameterName}"
          th:value="${_csrf.token}"
        />

        <div class="col-md-6">
          <label class="form-label">Başlık</label>
          <input
            type="text"
            th:field="*{baslik}"
            class="form-control"
            required
          />
        </div>

        <div class="col-md-6">
          <label class="form-label">Fiyat</label>
          <input
            type="number"
            th:field="*{fiyat}"
            step="0.01"
            class="form-control"
            required
          />
        </div>

        <div class="col-12">
          <label class="form-label">Adres</label>
          <input
            type="text"
            th:field="*{adres}"
            class="form-control"
            required
          />
        </div>

        <div class="col-md-4">
          <label class="form-label">Oda Sayısı</label>
          <input type="number" th:field="*{odaSayisi}" class="form-control" />
        </div>

        <div class="col-md-4">
          <label class="form-label">Metrekare</label>
          <input type="number" th:field="*{metrekare}" class="form-control" />
        </div>

        <div class="col-md-4">
          <label class="form-label">Bina Yaşı</label>
          <input type="number" th:field="*{binaYasi}" class="form-control" />
        </div>

        <!-- İl -->
        <div class="col-md-6">
          <label class="form-label">İl</label>
          <select
            id="ilSelect"
            th:field="*{il.id}"
            class="form-select"
            required
          >
            <option value="">İl seçin</option>
            <option
              th:each="il : ${iller}"
              th:value="${il.id}"
              th:text="${il.ad}"
            ></option>
          </select>
        </div>

        <!-- İlçe -->
        <div class="col-md-6">
          <label class="form-label">İlçe</label>
          <select
            id="ilceSelect"
            th:field="*{ilce.id}"
            class="form-select"
            required
          >
            <option value="">Önce il seçin</option>
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label">Kat</label>
          <input type="number" th:field="*{kat}" class="form-control" />
        </div>

        <div class="col-md-6">
          <label class="form-label">Eşyalı mı?</label>
          <select th:field="*{esyali}" class="form-select">
            <option value="1">Evet</option>
            <option value="0">Hayır</option>
          </select>
        </div>

        <div class="col-12">
          <label class="form-label">Isıtma Tipi</label>
          <input type="text" th:field="*{isitmaTipi}" class="form-control" />
        </div>

        <div class="col-md-6">
          <label class="form-label">Kategori</label>
          <select
            id="kategoriSelect"
            th:field="*{kategori.id}"
            class="form-select"
            required
          >
            <option value="">Kategori seçin</option>
            <option
              th:each="k : ${kategoriler}"
              th:value="${k.id}"
              th:text="${k.ad}"
            ></option>
          </select>
        </div>

        <div class="col-12">
          <label class="form-label">Açıklama</label>
          <textarea
            th:field="*{aciklama}"
            rows="4"
            class="form-control"
          ></textarea>
        </div>
        <!-- MEVCUT FOTOĞRAFLAR -->
        <div class="col-12 mt-3">
          <label class="form-label fw-bold">Mevcut Fotoğraflar</label>

          <div class="row">
            <div class="col-3" th:each="f : ${emlak.fotolar}">
              <div class="position-relative mb-3">
                <div class="foto-kutu">
                  <img
                    th:src="@{${f.url}}"
                    class="img-fluid rounded"
                    style="height: 120px; object-fit: cover"
                  />
                </div>

                <button
                  class="btn btn-danger btn-sm"
                  style="position: absolute; top: 5px; right: 5px"
                  th:onclick="|fotoSil(${f.id}, ${emlak.id})|"
                >
                  Sil
                </button>
              </div>
            </div>
          </div>
        </div>
        <!-- FOTOĞRAF ALANI (DÜZENLENMİŞ) -->
        <div class="col-12">
          <label class="form-label fw-bold">Fotoğraflar</label>
          <input
            type="file"
            name="dosyalar"
            class="form-control"
            accept="image/*"
            multiple
          />
          <small class="text-muted">Birden fazla fotoğraf seçebilirsin.</small>
        </div>

        <!-- BUTONLAR -->
        <div class="col-12 d-flex gap-3 mt-3">
          <button type="submit" class="btn btn-success">Kaydet</button>
          <a href="/satici/ilanlarim" class="btn btn-secondary">Geri Dön</a>
        </div>

        <input type="hidden" id="selectedIlceId" th:value="*{ilce.id}" />
      </form>
    </div>

    <script>
      document
        .getElementById("ilSelect")
        .addEventListener("change", function () {
          const ilId = this.value;
          const ilceSelect = document.getElementById("ilceSelect");

          if (!ilId) {
            ilceSelect.innerHTML = '<option value="">Önce il seçin</option>';
            return;
          }

          fetch("/ilce/getByIl/" + ilId)
            .then((response) => response.json())
            .then((data) => {
              ilceSelect.innerHTML = "";
              const selectedIlceId =
                document.getElementById("selectedIlceId").value;

              data.forEach((ilce) => {
                const option = document.createElement("option");
                option.value = ilce.id;
                option.textContent = ilce.ad;

                if (ilce.id == selectedIlceId) {
                  option.selected = true;
                }

                ilceSelect.appendChild(option);
              });
            });
        });

      window.addEventListener("load", function () {
        const ilId = document.getElementById("ilSelect").value;
        if (ilId) {
          document
            .getElementById("ilSelect")
            .dispatchEvent(new Event("change"));
        }
      });
    </script>
    <script>
      function fotoSil(fotoId, emlakId) {
        if (!confirm("Bu fotoğraf silinsin mi?")) return;

        fetch(`/satici/foto-sil/${fotoId}`, {
          method: "DELETE",
        })
          .then((res) => res.text())
          .then((msg) => {
            location.reload();
          })
          .catch((err) => console.error("Silme hatası:", err));
      }
    </script>
  </body>
</html>
