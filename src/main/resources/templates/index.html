<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Ana Sayfa</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div th:replace="~{navbar :: body}"></div>

    <div
      class="bg-dark text-white py-5"
      style="
        background: url(&quot;https://images.unsplash.com/photo-1501183638710-841dd1904471?auto=format&fit=crop&w=1350&q=80&quot;)
          center/cover no-repeat;
      "
    >
      <div class="container text-center py-5">
        <h1 class="fw-bold mb-4">Hayalindeki Evi Bul</h1>

        <form
          th:action="@{/emlak}"
          method="get"
          class="d-flex justify-content-center"
        >
          <input
            type="text"
            name="q"
            class="form-control form-control-lg w-50"
            placeholder="Konum, ilan no veya anahtar kelime ile ara..."
          />
          <button class="btn btn-danger btn-lg ms-2">Ara</button>
        </form>
      </div>
    </div>
  </body>
</html>
